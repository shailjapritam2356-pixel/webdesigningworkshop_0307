<!DOCTYPE html>
<html>
<head>
    <title>Select, Textarea and Buttons</title>
</head>
<body>

    <form>
        <label for="course">Course:</label>
        <select id="course" name="course">
            <option>CSE</option>
            <option>ECE</option>
            <option>ECE</option>
            <option>ME</option>
        </select>
        <br><br>

        <label for="feedback">Feedback:</label>
        <br>
        <textarea id="feedback" name="feedback" rows="4" cols="40" placeholder="Write here..."></textarea>
        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        <button type="button" onclick="alert('Hello!')">Click Me</button>

    </form>

</body>
</html>
